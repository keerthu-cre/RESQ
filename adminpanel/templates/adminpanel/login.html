{% extends 'adminpanel/base.html' %}

{% block public_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-dark py-5" style="background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);">
  <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4" style="max-width: 440px; width: 90%; background: #ffffff;">
    <div class="text-center mb-4">
      <div class="bg-danger text-white rounded-4 p-3 d-inline-flex align-items-center justify-content-center shadow mb-3" style="width: 64px; height: 64px;">
        <i class="fa-solid fa-shield-halved fs-2"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">RESQ Admin Center</h3>
      <p class="text-muted small">Campus Emergency & Safety Management System</p>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-danger alert-dismissible fade show small" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'admin_login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small text-secondary">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
          <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="admin" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold small text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-danger w-100 py-2.5 rounded-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
      </button>

      <div class="mt-4 text-center">
        <div class="badge bg-light text-muted border p-2 w-100 text-start font-monospace small">
          <div><i class="fa-solid fa-key me-1"></i> Demo Credentials:</div>
          <div>User: <b>admin</b> | Pass: <b>admin123</b></div>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
